        if (!_pillContextCtx) { $('folder-confirm-dialog').close(); return; }
        const folder = _pillContextCtx;
        $('folder-confirm-dialog').close();
        _pillContextCtx = null;
        const r = await window.vault.folders.remove(folder.id);
        if (!r.ok) { setStatus('Delete folder failed: ' + r.error, 'error'); return; }
        if (_currentFolderId === folder.id) _currentFolderId = 'all';
        await refresh();
        setStatus(`Folder "${folder.name}" deleted`, 'ok');
    };

    // ---- Tag bar (only tags present in the current view) ----------------
    function renderTagBar() {
        const root = $('tagbar-scroll');
        root.innerHTML = '';
        // Compute which assets are in scope WITHOUT applying the tag filter,
        // so the tag chips reflect the current folder + search context.
        const scoped = _allAssets.filter(a => folderMatch(a) && searchMatch(a));
        const counts = new Map();
        for (const a of scoped) {
            for (const t of (a.tags || [])) {
                counts.set(t, (counts.get(t) || 0) + 1);
            }
        }
        if (counts.size === 0) {
            const e = document.createElement('span');
            e.className = 'tagbar-empty';
            e.textContent = 'No tags in this view yet.';
            root.appendChild(e);
            return;
        }
        // Sort: most common first, then alphabetical.
        const sorted = Array.from(counts.entries())
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

        if (_activeTag) {
            const clear = document.createElement('button');
            clear.className = 'tag-chip tag-chip-clear';
            clear.innerHTML = `<span>Clear filter</span>`;
            clear.onclick = () => { _activeTag = null; renderTagBar(); renderGrid(); };
            root.appendChild(clear);
        }
        for (const [tag, count] of sorted) {
            const chip = document.createElement('button');
            chip.className = 'tag-chip';
            chip.style.setProperty('--tag-hue', String(hueForTag(tag)));
            if (_activeTag === tag) chip.dataset.active = 'true';
            chip.innerHTML = `
                <span class="tag-chip-dot"></span>
                <span>${escapeHTML(tag)}</span>
                <span class="tag-chip-count">${count}</span>`;
            chip.onclick = () => {
                _activeTag = (_activeTag === tag) ? null : tag;
                renderTagBar();
                renderGrid();
            };
            root.appendChild(chip);
        }
    }

    // ---- Filtering primitives ------------------------------------------
    function folderMatch(a) {
        if (_currentFolderId === 'all')      return true;
        if (_currentFolderId === 'unfiled')  return !a.folderId;
        return a.folderId === _currentFolderId;
    }
    function searchMatch(a) {
        const s = (_searchTerm || '').toLowerCase().trim();
        if (!s) return true;
        if ((a.name || '').toLowerCase().indexOf(s) >= 0) return true;
        if (Array.isArray(a.tags)) {
            for (const t of a.tags) {
                if ((t || '').toLowerCase().indexOf(s) >= 0) return true;
            }
        }
        return false;
    }
    function tagMatch(a) {
        if (!_activeTag) return true;
        return Array.isArray(a.tags) && a.tags.indexOf(_activeTag) >= 0;
    }

    // ---- Grid ----------------------------------------------------------
    function renderGrid() {
        const main = $('canvas-scroll');
        const matches = _allAssets.filter(a => folderMatch(a) && searchMatch(a) && tagMatch(a));

        document.body.dataset.folderFiltered =
            (_currentFolderId !== 'all' && _currentFolderId !== 'unfiled') ? '1' : '0';

        // Breadcrumb + count
        const view =
            _currentFolderId === 'all'      ? 'All' :
            _currentFolderId === 'unfiled'  ? 'Unfiled' :
            ((_folders.find(f => f.id === _currentFolderId) || {}).name || 'Folder');
        $('bc-current').textContent = view;
        $('bc-count').textContent =
            matches.length === _allAssets.length
                ? `${matches.length} asset${matches.length === 1 ? '' : 's'}`
                : `${matches.length} / ${_allAssets.length}`;
        $('statusbar-count').textContent =
            matches.length === _allAssets.length
                ? `${_allAssets.length} assets · ${_folders.length} folders`
                : `showing ${matches.length} of ${_allAssets.length}`;

        if (matches.length === 0) {
            const reason = _searchTerm
                ? `No assets match "${escapeHTML(_searchTerm)}"`
                : (_activeTag
                    ? `No assets tagged "${escapeHTML(_activeTag)}" in this view`
                    : (_currentFolderId === 'unfiled'
                        ? 'No unfiled assets — everything is in a folder.'
                        : (_currentFolderId !== 'all'
                            ? 'This folder is empty. Drag a card onto it to file something here.'
                            : 'Vault is empty.')));
            main.innerHTML = `<div class="empty"><div class="empty-title">Nothing to show</div><div class="empty-sub">${reason}</div></div>`;
            return;
        }
        main.innerHTML = '';
        if (_viewMode === 'list') {
            main.appendChild(renderList(matches));
        } else {
            const grid = document.createElement('div');
            grid.className = 'grid';
            for (const a of matches) grid.appendChild(renderCard(a));
            main.appendChild(grid);
        }
    }

    // dev34 — list view. Same data the grid card consumes, projected
    // into a single grid-template row. The header reuses the same
    // template so columns stay aligned. Each row keeps drag-and-drop
    // (assetId on dataTransfer) so filing into folders works in either
    // view. Thumbnails come from the same async mediaPaths IPC the
    // grid uses — placeholder cell is "—" until it resolves.
    function renderList(matches) {
        const list = document.createElement('div');
        list.className = 'list';

        // dev36 — sortable headers. Tags has no defined order so it stays
        // a plain label. Each sortable cell carries [data-sort-key]; the
        // body click handler reads that to flip the sort. The active
        // column shows an arrow glyph (▲ asc / ▼ desc) painted via CSS.
        const head = document.createElement('div');
        head.className = 'list-row list-head';
        const mkHeadCell = (label, key, opts) => {
            const o = opts || {};
            const cell = document.createElement('div');
            if (key) {
                cell.className = 'list-head-sortable';
                cell.dataset.sortKey = key;
                if (_listSort.key === key) {
                    cell.dataset.sortActive = 'true';
                    cell.dataset.sortDir = _listSort.dir;
                }
            }
            if (o.align === 'right') cell.style.textAlign = 'right';
            cell.innerHTML = `<span>${label}</span>` +
                (key ? '<span class="list-head-arrow"></span>' : '');
            return cell;
        };
        head.appendChild(mkHeadCell('', null));            // thumb col
        head.appendChild(mkHeadCell('Asset',      'name'));
        head.appendChild(mkHeadCell('Tags',        null));
        head.appendChild(mkHeadCell('Resolution', 'res'));
        head.appendChild(mkHeadCell('Duration',   'dur'));
        head.appendChild(mkHeadCell('Size',       'size'));
        head.appendChild(mkHeadCell('Used',       'used'));
        head.appendChild(mkHeadCell('Added',      'added'));
        head.appendChild(mkHeadCell('Actions',     null, { align: 'right' }));

        head.addEventListener('click', (e) => {
            const cell = e.target.closest('[data-sort-key]'); if (!cell) return;
            const k = cell.dataset.sortKey;
            // Toggle direction if same column; otherwise pick the
            // sensible default per type — text ascends, numerics +
            // dates descend (most useful "newest / biggest first").
            let dir;
            if (_listSort.key === k) {
                dir = _listSort.dir === 'desc' ? 'asc' : 'desc';
            } else {
                dir = (k === 'name') ? 'asc' : 'desc';
            }
            _listSort = { key: k, dir };
            try { localStorage.setItem('vault.listSort', JSON.stringify(_listSort)); } catch (_) {}
            renderGrid();   // re-project; cheap, no IPC.
        });

        list.appendChild(head);

        const body = document.createElement('div');
        body.className = 'list-body';
        const sorted = applyListSort(matches);
        for (const a of sorted) body.appendChild(renderRow(a));
        list.appendChild(body);
        return list;
    }

    function renderRow(a) {
        const isClip     = (a.type === 'clip');
        const isCompTpl  = a.templateKind === 'comp';
        const isLayerTpl = a.templateKind === 'layer';

        const row = document.createElement('div');
        row.className = 'list-row';
        row.dataset.assetId = a.assetId;
        row.dataset.type    = a.type || 'asset';

        // Drag-and-drop parity with the grid card. Sidebar / pill drop
        // targets read [data-drag-target] and accept assetId on drop.
        row.draggable = true;
        row.addEventListener('dragstart', (e) => {
            row.dataset.dragging = 'true';
            document.body.dataset.dragging = '1';
            document.querySelectorAll('[data-droppable="1"]')
                .forEach(el => el.dataset.dragTarget = 'true');
            try {
                e.dataTransfer.setData('text/plain', a.assetId);
                e.dataTransfer.setData('application/x-chiral-asset-id', a.assetId);
                e.dataTransfer.effectAllowed = 'move';
            } catch (_) {}
        });
        row.addEventListener('dragend', () => {
            row.dataset.dragging = 'false';
            document.body.dataset.dragging = '0';
            document.querySelectorAll('[data-drag-target="true"]')
                .forEach(el => { delete el.dataset.dragTarget; delete el.dataset.dragOver; });
        });

        // Thumb cell.
        const tcell = document.createElement('div');
        tcell.className = 'list-thumb';
        const tph = document.createElement('span');
        tph.className = 'list-thumb-ph';
        tph.textContent = isClip ? '📎' : (isCompTpl || isLayerTpl ? 'TPL' : '—');
        tcell.appendChild(tph);
        row.appendChild(tcell);

        // Asset cell — name + origin.
        const acell = document.createElement('div');
        const nm = document.createElement('div');
        nm.className = 'list-asset-name';
        nm.textContent = a.name || '(unnamed)';
        nm.title = a.name || '';
        const og = document.createElement('div');
        og.className = 'list-asset-origin';
        og.innerHTML = `${escapeHTML(a.originProject || '?')} · <span class="mono">${escapeHTML(a.originShot || '')}</span>`;
        acell.appendChild(nm);
        acell.appendChild(og);
        row.appendChild(acell);

        // Tags cell — first 4 chips + "+N" overflow marker.
        const tagsCell = document.createElement('div');
        tagsCell.className = 'list-tags';
        if (Array.isArray(a.tags) && a.tags.length) {
            const shown = a.tags.slice(0, 4);
            for (const t of shown) {
                const ch = document.createElement('span');
                ch.className = 'list-tag';
                ch.textContent = t;
                tagsCell.appendChild(ch);
            }
            if (a.tags.length > shown.length) {
                const more = document.createElement('span');
                more.className = 'list-tag-more';
                more.textContent = `+${a.tags.length - shown.length}`;
                more.title = a.tags.slice(shown.length).join(', ');
                tagsCell.appendChild(more);
            }
        } else {
            const dash = document.createElement('span');
            dash.className = 'list-tag-more';
            dash.textContent = '—';
            tagsCell.appendChild(dash);
        }
        row.appendChild(tagsCell);

        // Spec cells.
        const resCell = document.createElement('div');
        resCell.className = 'list-cell-mono';
        resCell.textContent = fmtRes(a.specAtVault);
        row.appendChild(resCell);

        const durCell = document.createElement('div');
        durCell.className = 'list-cell-mono';
        durCell.textContent = fmtDuration(a.specAtVault);
        row.appendChild(durCell);

        // dev37 — Size cell. Reads sizeBytes (stamped at index-rebuild
        // time by lib/vault.js#dirSizeBytes). Legacy rows from a vault
        // built pre-dev37 have null sizeBytes and render "—" until the
        // user hits Rebuild.
        const sizeCell = document.createElement('div');
        sizeCell.className = 'list-cell-mono';
        sizeCell.textContent = fmtBytes(a.sizeBytes);
        if (typeof a.sizeBytes === 'number') sizeCell.title = a.sizeBytes.toLocaleString() + ' bytes';
        row.appendChild(sizeCell);

        const usedCell = document.createElement('div');
        usedCell.className = 'list-cell-mono list-cell-used';
        usedCell.dataset.zero = (a.usageCount || 0) === 0 ? 'true' : 'false';
        usedCell.textContent = `used ${a.usageCount || 0}×`;
        row.appendChild(usedCell);

        const addedCell = document.createElement('div');
        addedCell.className = 'list-cell-mono';
        addedCell.textContent = timeAgo(a.vaultedAt);
        if (a.vaultedAt) addedCell.title = a.vaultedAt;
        row.appendChild(addedCell);

        // Actions cell — primary "→ AE" + kebab menu with the rest.
        // Same affordances as the grid card; the kebab keeps the row
        // visually quiet until needed.
        const actCell = document.createElement('div');
        actCell.className = 'list-actions';

        const primary = document.createElement('button');
        primary.className = 'list-action list-action-primary';
        primary.textContent = '→ AE';
        primary.dataset.act = 'toAE';
        primary.title = isClip
            ? 'Drop these files into the open AE project'
            : 'Drop this asset into the open AE project as a folder of comps';
        actCell.appendChild(primary);

        const kebab = document.createElement('button');
        kebab.className = 'list-kebab';
        kebab.textContent = '⋯';
        kebab.title = 'More actions';
        actCell.appendChild(kebab);

        const menu = document.createElement('div');
        menu.className = 'list-kebab-menu';
        menu.dataset.open = 'false';
        const mkItem = (act, label, danger) => {
            const b = document.createElement('button');
            b.className = 'list-kebab-item' + (danger ? ' list-kebab-item-danger' : '');
            b.dataset.act = act;
            b.textContent = label;
            return b;
        };
        if (!isClip) menu.appendChild(mkItem('toResolve',  '→ Resolve'));
        if (!isClip) menu.appendChild(mkItem('toAEAsShot', 'as shot…'));
        menu.appendChild(mkItem('reveal',     'Reveal'));
        menu.appendChild(mkItem('delete',     'Delete', true));
        actCell.appendChild(menu);

        kebab.addEventListener('click', (e) => {
            e.stopPropagation();
            // Close any other open menu first.
            document.querySelectorAll('.list-kebab-menu[data-open="true"]')
                .forEach(m => { if (m !== menu) m.dataset.open = 'false'; });
            menu.dataset.open = menu.dataset.open === 'true' ? 'false' : 'true';
        });

        const handle = async (act) => {
            menu.dataset.open = 'false';
            if (act === 'reveal')        await window.vault.reveal(a.assetId);
            else if (act === 'delete') {
                if (!confirm(`Move "${a.name}" to Vault trash? (7-day retention)`)) return;
                const r = await window.vault.delete(a.assetId);
                if (r.ok) { await refresh(); setStatus('Deleted (recoverable for 7 days)', 'ok'); }
                else      setStatus('Delete failed: ' + r.error, 'error');
            }
            else if (act === 'toResolve')  await openImportDialog(a, 'resolve');
            else if (act === 'toAE')       { isClip ? await sendClipToAE(a) : await sendAssetToOpenAE(a); }
            else if (act === 'toAEAsShot') await openImportDialog(a, 'ae');
        };
        primary.addEventListener('click', (e) => { e.stopPropagation(); handle('toAE'); });
        menu.addEventListener('click', (e) => {
            const b = e.target.closest('button.list-kebab-item'); if (!b) return;
            e.stopPropagation();
            handle(b.dataset.act);
        });

        row.appendChild(actCell);

        // Async media — same IPC the grid card uses.
        if (!isClip) {
            window.vault.mediaPaths(a.assetId).then(r => {
                if (!r || !r.ok || !r.thumbnail) return;
                const fileUrl = p => 'file:///' + p.replace(/\\/g, '/');
                tcell.innerHTML = '';
                const img = document.createElement('img');
                img.src = fileUrl(r.thumbnail);
                img.alt = '';
                tcell.appendChild(img);
            });
        }

        return row;
    }

    // dev32 — Trash drawer. Rendered on open via window.vault.trash.list().
    // Single source of truth for the count is the live list; the
    // sidebar's `_trashCount` cache is updated whenever we fetch.
    async function refreshTrashCount() {
        try {
            const r = await window.vault.trash.list();
            _trashCount = (r && r.entries) ? r.entries.length : 0;
        } catch (_) { _trashCount = 0; }
    }

    function fmtTrashAge(entry, retentionDays) {
        // Human-friendly: "deleted 3 days ago, 4 days left"
        if (entry.ageDays == null) return 'deleted (unknown date)';
        const ago = entry.ageDays === 0 ? 'today' : `${entry.ageDays}d ago`;
        const left = (entry.daysRemaining == null)
            ? ''
            : (entry.daysRemaining === 0 ? ' · expires today' : ` · ${entry.daysRemaining}d left`);
        return `deleted ${ago}${left}`;
    }

    async function openTrashDrawer() {
        const list = $('trash-list');
        list.innerHTML = '<div class="trash-empty-state">Loading…</div>';
        $('trash-dialog').showModal();

        const r = await window.vault.trash.list();
        if (!r || !r.ok) {
            list.innerHTML = '<div class="trash-empty-state">Failed to load trash.</div>';
            return;
        }
        const entries = r.entries || [];
        _trashCount = entries.length;
        $('trash-count').textContent =
            entries.length === 0 ? '— empty —' : `${entries.length} item${entries.length === 1 ? '' : 's'}`;
        $('trash-retention').textContent =
            `${r.retentionDays || 7}-day auto-purge`;
        renderSidebar();   // refresh the count badge

        if (entries.length === 0) {
            list.innerHTML = '<div class="trash-empty-state">Nothing in trash.</div>';
            $('trash-empty').disabled = true;
            return;
        }
        $('trash-empty').disabled = false;
        list.innerHTML = '';
        // Sort newest first — most recently deleted is most likely to be
        // the one the user wants to restore.
        entries.sort((a, b) => (a.ageDays || 0) - (b.ageDays || 0));
        for (const e of entries) {
            const row = document.createElement('div');
            row.className = 'trash-row';
            row.dataset.entry = e.entry;
            const expiring = (e.daysRemaining != null && e.daysRemaining <= 1);
            row.innerHTML = `
                <span class="trash-row-name" title="${escapeHTML(e.name)}">${escapeHTML(e.name)}</span>
                <span class="trash-row-meta" data-expiring="${expiring ? 'true' : 'false'}">
                    ${escapeHTML(fmtTrashAge(e, r.retentionDays || 7))}
                </span>
                <button class="trash-row-restore" data-restore="${escapeHTML(e.entry)}">Restore</button>
            `;
            list.appendChild(row);
        }
    }

    $('trash-close').onclick = () => $('trash-dialog').close();
    $('trash-list').addEventListener('click', async (e) => {
        const btn = e.target.closest('button.trash-row-restore');
        if (!btn) return;
        const entry = btn.dataset.restore;
        btn.disabled = true; btn.textContent = '…';
        const r = await window.vault.trash.restore(entry);
        if (!r || !r.ok) {
            btn.disabled = false; btn.textContent = 'Restore';
            setStatus('Restore failed: ' + (r && r.error || 'unknown'), 'error');
            return;
        }
        // Drop the row in place + re-fetch the index so the asset
        // reappears in the grid behind the modal.
        btn.closest('.trash-row').remove();
        await refresh();
        await openTrashDrawer();   // re-renders the list with the row gone
    });
    $('trash-empty').onclick = () => $('trash-confirm-dialog').showModal();
    $('trash-confirm-cancel').onclick = () => $('trash-confirm-dialog').close();
    $('trash-confirm-go').onclick = async () => {
        $('trash-confirm-dialog').close();
        const r = await window.vault.trash.empty();
        if (!r || !r.ok) {
            setStatus('Empty trash failed: ' + (r && r.error || 'unknown'), 'error');
            return;
        }
        setStatus(`Trash emptied · ${r.count || 0} entr${(r.count || 0) === 1 ? 'y' : 'ies'} purged`, 'ok');
        _trashCount = 0;
        await openTrashDrawer();   // re-render shows empty state
        await refresh();
    };

    // ---- Refresh (top-level data load) ---------------------------------
    async function refresh() {
        const r = await window.vault.list();
        $('vault-path').textContent = r.vaultRoot || '(no vault configured)';
        _allAssets = r.assets || [];
        _folders   = r.folders || [];
        $('sb-stat-assets').textContent  = String(_allAssets.length);
        $('sb-stat-folders').textContent = String(_folders.length);
        // dev32 — pull the trash count once per refresh so the sidebar
        // entry shows a live number. Cheap (one IPC, returns fast for
        // an empty trash).
        refreshTrashCount().then(() => renderSidebar());

        if (!r.vaultRoot) {
            const main = $('canvas-scroll');
            main.innerHTML = `
                <div class="empty">
                    <div class="empty-title">No vault configured</div>
                    <div class="empty-sub">Pick a folder to start a vault. It'll hold your reusable shots, animations, and templates across projects.</div>
                    <button class="btn btn-ghost" id="btn-empty-pick" style="margin-top:14px;">Pick a folder…</button>
                </div>`;
            $('btn-empty-pick').onclick = () => $('btn-pick').click();
            renderSidebar();   // shows the "+ New folder" affordance even with no vault
            $('tagbar-scroll').innerHTML = '<span class="tagbar-empty">No vault configured.</span>';
            setStatus('No vault configured.', '');
            return;
        }
        if (!_allAssets.length) {
            const main = $('canvas-scroll');
            main.innerHTML = `
                <div class="empty">
                    <div class="empty-title">Vault is empty</div>
                    <div class="empty-sub">From the main window's overflow menu:<br><br>
                      <b>↑ Vault this shot</b> — saves the whole .aep + footage as a reusable asset.<br><br>
                      <b>↑ Vault marked clips / templates…</b> — saves only items you mark with
                      <code style="background:var(--bg-2); padding:1px 4px; border-radius:3px;">CHIRAL:TAG=name</code>
                      in any of: Project panel Comment, Timeline layer Comment, or a layer marker (Shift+8).
                    </div>
                </div>`;
            renderSidebar();
            $('tagbar-scroll').innerHTML = '<span class="tagbar-empty">No tags yet — vault something first.</span>';
            $('bc-current').textContent = 'All';
            $('bc-count').textContent = '0 assets';
            setStatus(`Vault ready · ${r.vaultRoot}`, 'ok');
            return;
        }
        renderSidebar();
        renderTagBar();
        renderGrid();
        setStatus(`Vault ready · ${_allAssets.length} asset${_allAssets.length === 1 ? '' : 's'}`, '');
    }

    // ---- Wire-up: search, sidebar filter, top buttons, AE busy ---------
    $('search-input').oninput = (e) => {
        _searchTerm = e.target.value || '';
        // Tag bar reflects the current text-filtered scope, so re-render
        // it too (cheap — small in-memory map walk).
        renderTagBar();
        renderGrid();
    };
    $('sb-filter-input').oninput = (e) => {
        _sbFilter = e.target.value || '';
        renderSidebar();
    };
    // dev33 — Add asset (.aep picker). The IPC handler returns
    // { ok: false, canceled: true } if the user backed out of the
    // dialog — we treat that as a no-op (no toast spam). On success
    // we refresh and surface the new asset's id in the status bar
    // so a thumbnail-render race doesn't make it look like nothing
    // happened.
    $('btn-add-asset').onclick = async () => {
        const btn = $('btn-add-asset');
        if (btn.disabled) return;
        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = '…';
        try {
            const r = await window.vault.addExternalAEP();
            if (r && r.canceled) return;
            if (!r || !r.ok) {
                setStatus('Add asset failed: ' + ((r && r.error) || 'unknown'), 'error');
                return;
            }
            setStatus(`Added external asset · ${r.assetId.slice(0, 8)}`, 'ok');
            await refresh();
        } finally {
            btn.disabled = false;
            btn.textContent = original;
        }
    };

    $('btn-refresh').onclick = refresh;
    // dev34 — view toggle. Sync DOM to the persisted state on boot,
    // then on click flip the mode, persist, re-render. We don't go
    // through refresh() (which would re-fetch the index) — pure DOM
    // re-projection is enough.
    (function initViewToggle() {
        const tg = $('view-toggle');
        if (!tg) return;
        const sync = () => {
            tg.querySelectorAll('button[data-view]').forEach(b => {
                b.dataset.active = (b.dataset.view === _viewMode) ? 'true' : 'false';
            });
        };
        sync();
        tg.addEventListener('click', (e) => {
            const b = e.target.closest('button[data-view]'); if (!b) return;
            const next = b.dataset.view;
            if (next === _viewMode) return;
            _viewMode = next;
            try { localStorage.setItem('vault.viewMode', next); } catch (_) {}
            sync();
            renderGrid();
        });
    })();
    // Close any open list-view kebab menu on outside click. Cheap
    // global handler — beats wiring focus-out per row.
    document.addEventListener('click', () => {
        document.querySelectorAll('.list-kebab-menu[data-open="true"]')
            .forEach(m => m.dataset.open = 'false');
    });
    $('btn-pick').onclick    = async () => {
        const r = await window.vault.pickRoot();
        if (r && r.ok) await refresh();
    };
    $('btn-rebuild').onclick = async () => {
        setStatus('Rebuilding index…', 'busy');
        const r = await window.vault.rebuildIndex();
        if (r && r.ok) { setStatus(`Index rebuilt · ${r.count} assets`, 'ok'); await refresh(); }
        else            setStatus('Rebuild failed: ' + (r && r.error), 'error');
    };
    // dev27 — vault badge IS the collapse trigger. We don't swap the
    // badge glyph (the dev26 button toggled « / »); the badge stays the
    // 🗄 icon and the collapsed/expanded state is conveyed by the
    // sidebar width itself, which is the more honest signal.
    $('btn-sb-collapse').onclick = () => {
        const next = document.body.dataset.sbCollapsed === '1' ? '0' : '1';
        document.body.dataset.sbCollapsed = next;
        $('btn-sb-collapse').title = next === '1' ? 'Expand sidebar' : 'Collapse sidebar';
    };

    // dev20 — broadcast AE busy state. Disables card actions while a
    // script is in flight so the user can't dispatch a second `-r`.
    if (window.vault && typeof window.vault.onAEBusy === 'function') {
        window.vault.onAEBusy(state => {
            document.body.dataset.aeBusy = state.busy ? '1' : '0';
            if (state.busy) {
                const tag = state.label ? ` (${state.label})` : '';
                setStatus(`After Effects busy${tag} — please wait…`, 'busy');
            }
        });
    }

    // dev43 — push-driven refresh. Main-process fs.watch on the vault's
    // assets/ tree fires a debounced 'vault:changed' event whenever
    // anything mutates (asset added / removed / file renamed). Renderer
    // double-debounces to coalesce bursts; pause while hidden so the
    // backgrounded vault window is free.
    if (window.vault && typeof window.vault.onVaultChanged === 'function') {
        let pushTimer = null;
        window.vault.onVaultChanged(() => {
            if (document.hidden) return;   // skip while not visible
            if (pushTimer) clearTimeout(pushTimer);
            pushTimer = setTimeout(() => { pushTimer = null; refresh(); }, 100);
        });
    }
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();   // re-sync on return to view
    });

    refresh();
</script>
</body>
</html>
